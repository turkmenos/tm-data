name: Validate datasets

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Generate dataset quality report
        id: quality
        continue-on-error: true
        run: go run ./tools/quality --output "$RUNNER_TEMP/quality/summary.json"

      - name: Upload dataset quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-quality-report
          path: ${{ runner.temp }}/quality/summary.json
          if-no-files-found: warn

      - name: Test validation packages
        run: go test ./internal/...

      - name: Test dataset quality report
        run: go test ./tools/quality

      - name: Validate datasets
        run: go run ./tools/validate/main.go

      - name: Validate dataset integrity
        run: go run ./tools/integrity

      - name: Test Turkmen text validation
        run: go test ./tools/validation

      - name: Test Turkmen text normalization
        run: go test ./tools/normalization

      - name: Validate normalization fixtures
        run: go run ./tools/normalization --check

      - name: Test unified names dataset
        run: go test ./tools/names

      - name: Check unified names dataset freshness
        run: go run ./tools/names --check

      - name: Test morphology integrity checks
        run: go test ./tools/morphology

      - name: Validate morphology analyses
        run: go run ./tools/morphology

      - name: Test dataset catalog
        run: go test ./tools/catalog

      - name: Test CSV exports
        run: go test ./tools/csvexports

      - name: Check CSV export freshness
        run: go run ./tools/csvexports --check

      - name: Test GeoJSON export
        run: go test ./tools/geojson

      - name: Check GeoJSON export freshness
        run: go run ./tools/geojson --check

      - name: Test geographic search
        run: go test ./tools/geosearch

      - name: Check geographic search index freshness
        run: go run ./tools/geosearch --check

      - name: Check dataset catalog freshness
        run: go run ./tools/catalog --check

      - name: Check dataset quality report freshness
        run: go run ./tools/quality --check

      - name: Fail on critical quality errors
        if: steps.quality.outcome == 'failure'
        run: |
          echo "The dataset quality report contains errors; see the generate step log and the dataset-quality-report artifact."
          exit 1
