name: Validate datasets

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Validate datasets
        run: go run ./tools/validate/main.go

      - name: Validate dataset integrity
        run: go run ./tools/integrity

      - name: Test Turkmen text validation
        run: go test ./tools/validation
